<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Ledger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxMjMzMzEiLz4KICA8cmVjdCB4PSIxMyIgeT0iMzMiIHdpZHRoPSIxMSIgaGVpZ2h0PSIxNiIgcng9IjMiIGZpbGw9IiNkOWE2MzYiLz4KICA8cmVjdCB4PSIyNi41IiB5PSIyMiIgd2lkdGg9IjExIiBoZWlnaHQ9IjI3IiByeD0iMyIgZmlsbD0iI2Q5YTYzNiIvPgogIDxyZWN0IHg9IjQwIiB5PSIxMSIgd2lkdGg9IjExIiBoZWlnaHQ9IjM4IiByeD0iMyIgZmlsbD0iI2Q5YTYzNiIvPgo8L3N2Zz4K">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#123331;
    --ink-2:#1c4744;
    --paper:#efe8d8;
    --paper-2:#e6ddc8;
    --paper-line:#d8cbaa;
    --text:#20241f;
    --text-dim:#5a6058;
    --ochre:#b8811f;
    --ochre-deep:#8f640f;
    --brick:#a3392a;
    --cream:#f8f5ec;
    --fallback-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --fallback-serif: Georgia, "Times New Roman", serif;
    --fallback-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --cream-fixed:#f8f5ec; /* always-light text/dots for the always-dark ink header & date picker — must NOT shift in dark mode */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#16241f; --paper-2:#1c2c26; --paper-line:#2c3b33;
      --text:#eee7d6; --text-dim:#9fa89c; --cream:#1c2c26;
      --ink:#0d1a17; --ink-2:#12241f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#16241f; --paper-2:#1c2c26; --paper-line:#2c3b33;
    --text:#eee7d6; --text-dim:#9fa89c; --cream:#1c2c26;
    --ink:#0d1a17; --ink-2:#12241f;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--ink);
    background-image: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    font-family: 'IBM Plex Sans', var(--fallback-sans);
    color:var(--text);
    overscroll-behavior:none;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  .app{
    height:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:14px 8px 10px;
  }
  @media (min-width:480px){
    .app{ padding:18px 14px 12px; }
  }

  .topbar{
    width:100%;
    max-width:480px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:2px 4px 12px;
    color:var(--cream-fixed);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
    flex-shrink:1;
  }
  .brand{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-weight:800;
    font-style:italic;
    font-size:clamp(15px, 4.6vw, 20px);
    letter-spacing:0.2px;
    color:var(--cream-fixed);
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand .ledger{ color:var(--ochre); font-style:normal; }
  .brand-badge{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:9px;
    font-weight:600;
    letter-spacing:0.07em;
    color:var(--ink);
    background:var(--ochre);
    border-radius:100px;
    padding:2.5px 7px 1.5px;
    flex-shrink:0;
  }
  @media (max-width:360px){
    .brand-badge{ display:none; }
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .meta{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.025em;
    color:var(--cream-fixed);
    text-align:right;
    line-height:1.35;
    min-width:0;
    text-shadow:0 1px 0 rgba(0,0,0,.18);
  }
  .fsbtn{
    flex-shrink:0;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #3c4d45;
    border-radius:7px;
    background:var(--ink-2);
    color:var(--cream-fixed);
    cursor:pointer;
    padding:0;
    transition: border-color .15s, background .15s;
  }
  .fsbtn:hover, .fsbtn:focus{ border-color:var(--ochre); }
  .fsbtn svg{ width:14px; height:14px; }
  .fsbtn.spinning svg{ animation:spin .7s linear; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .update-banner{
    display:none;
    width:100%;
    max-width:480px;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 4px 10px;
    padding:9px 12px;
    border-radius:10px;
    background:linear-gradient(180deg, #2a3a2f 0%, #1c2c26 100%);
    border:1px solid var(--ochre);
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11.5px;
    color:var(--cream-fixed);
    animation: bannerIn .25s ease;
  }
  .update-banner.show{ display:flex; }
  @keyframes bannerIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .update-banner-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .update-banner button{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    border-radius:6px;
    padding:4px 8px;
    border:1px solid var(--ochre);
    background:var(--ochre);
    color:var(--ink);
  }
  .update-banner button#updateBannerDismiss{
    background:transparent;
    color:var(--cream-fixed);
    border-color:#3c4d45;
    padding:4px 7px;
  }

  .datepicker{
    width:100%;
    max-width:480px;
    display:flex;
    gap:7px;
    padding:0 4px 12px;
  }
  .dateselect{
    flex:1 1 0;
    min-width:0;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:14px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--cream-fixed);
    background:linear-gradient(180deg, #1f3d39 0%, var(--ink-2) 100%);
    border:1.5px solid #46584f;
    border-radius:9px;
    padding:9px 6px;
    text-align:center;
    text-align-last:center;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 3px rgba(0,0,0,.3);
    transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .dateselect:hover{ border-color:var(--ochre); }
  .dateselect:focus{
    border-color:var(--ochre);
    outline:none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 3px rgba(217,166,54,.28);
  }
  .dateselect:active{ transform:scale(.97); }
  .dateselect option{ background:var(--ink-2); color:var(--cream-fixed); font-weight:600; }

  .stage{
    position:relative;
    width:100%;
    max-width:480px;
    flex:1;
    display:flex;
    align-items:stretch;
    min-height:0;
  }

  .navzone{
    flex:0 0 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  @media (min-width:480px){
    .navzone{ flex-basis:28px; }
    .navzone svg{ width:16px; height:16px; }
  }
  .navzone svg{ width:14px; height:14px; opacity:0.55; transition:opacity .15s; }
  .navzone:hover svg{ opacity:0.95; }
  .navzone.disabled{ pointer-events:none; opacity:0.15; }

  .cardwrap{
    flex:1;
    min-width:0;
    position:relative;
    overflow:hidden;
    border-radius:18px;
  }

  /* Sits behind the active card at the very top of the stack; revealed
     as the card is dragged down during a pull-to-refresh gesture. */
  .pull-indicator{
    position:absolute;
    top:0; left:0; right:0;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:0;
    pointer-events:none;
    opacity:0;
  }
  .pull-indicator svg{
    width:19px;
    height:19px;
    color:var(--ochre);
    opacity:0.9;
  }
  .pull-indicator.refreshing svg{
    animation:spin .7s linear infinite;
  }

  /* .card only ever handles the left-right slide animation — it never
     scrolls itself, so animating its transform never fights a scroll
     gesture. .cardscroll is the one and only element that scrolls, and
     it never has a transition/transform on it, so scrolling stays smooth. */
  .card{
    position:absolute;
    inset:0;
    border-radius:18px;
    overflow:hidden;
    will-change:transform, opacity;
    pointer-events:none;
    transition: transform .38s cubic-bezier(.22,.68,0,1), opacity .3s ease;
  }
  .card.active{ pointer-events:auto; }
  .card.enter-right{ transform:translateX(24px); opacity:0; }
  .card.enter-left{ transform:translateX(-24px); opacity:0; }
  .card.active{ transform:translateX(0); opacity:1; }
  .card.leave-left{ transform:translateX(-24px); opacity:0; }
  .card.leave-right{ transform:translateX(24px); opacity:0; }

  .cardscroll{
    height:100%;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:18px;
    position:relative;
  }

  .cardinner{
    padding:18px 16px 22px;
    display:flex;
    flex-direction:column;
    min-height:100%;
    min-width:0;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  @media (min-width:480px){
    .cardinner{ padding:22px 22px 26px; }
  }

  .tag{
    display:inline-block;
    align-self:flex-start;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11px;
    letter-spacing:0.06em;
    font-weight:600;
    color:var(--ochre-deep);
    background:transparent;
    border:1px solid var(--ochre-deep);
    border-radius:100px;
    padding:4px 10px 3px;
    margin-bottom:14px;
    flex-shrink:0;
    max-width:100%;
    overflow-wrap:break-word;
  }

  h1{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-weight:700;
    font-size:clamp(20px, 5.8vw, 26px);
    line-height:1.22;
    margin:0 0 14px;
    color:var(--text);
    flex-shrink:0;
    overflow-wrap:break-word;
  }

  .dek p{
    font-size:15.5px;
    line-height:1.66;
    color:var(--text);
    margin:0 0 14px;
    overflow-wrap:break-word;
  }
  .dek p:last-child{ margin-bottom:0; }
  .dek b{ font-weight:600; color:var(--text); }

  .stats{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:10px;
    margin-top:18px;
    flex-shrink:0;
  }
  .stat{
    background:var(--cream);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:10px 12px;
    min-width:0;
  }
  .stat .v{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-weight:600;
    font-size:15.5px;
    color:var(--text);
    display:flex;
    align-items:baseline;
    gap:5px;
    flex-wrap:wrap;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .stat .v.up{ color:#2c6e49; }
  .stat .v.down{ color:var(--brick); }
  .stat .l{
    font-size:11px;
    color:var(--text-dim);
    margin-top:3px;
    line-height:1.3;
    overflow-wrap:break-word;
  }

  .source{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:16px;
    padding-top:10px;
    border-top:1px dashed var(--paper-line);
    flex-shrink:0;
  }

  .scrollcue{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    height:28px;
    margin-top:-28px;
    background:linear-gradient(180deg, rgba(239,232,216,0) 0%, var(--paper) 78%);
    pointer-events:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:5px;
  }
  .scrollcue svg{ width:14px; height:14px; opacity:0.4; color:var(--text-dim); }
  .cardscroll.at-bottom .scrollcue{ display:none; }

  .progressrow{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:center;
    gap:5px;
    padding:14px 4px 4px;
    flex-wrap:wrap;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:#3c4d45;
    cursor:pointer;
    transition: background .2s, transform .2s;
  }
  .dot.done{ background:var(--ochre); }
  .dot.now{ background:var(--cream-fixed); transform:scale(1.4); }

  .hint{
    text-align:center;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:10.5px;
    color:#7d8a80;
    padding-top:10px;
    letter-spacing:0.02em;
  }

  :focus-visible{ outline:2px solid var(--ochre); outline-offset:2px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-row">
      <div class="brand">Finance<span class="ledger">Ledger.</span></div>
      <div class="brand-badge">DAILY</div>
    </div>
    <div class="topbar-right">
      <div class="meta" id="metaTop">— · —</div>
      <button class="fsbtn" id="fsBtn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8 3 3 3 3 8"></polyline>
          <polyline points="16 3 21 3 21 8"></polyline>
          <polyline points="3 16 3 21 8 21"></polyline>
          <polyline points="21 16 21 21 16 21"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="update-banner" id="updateBanner">
    <span>✦ New stories are up — tap to refresh</span>
    <div class="update-banner-actions">
      <button id="updateBannerRefresh" type="button">Refresh</button>
      <button id="updateBannerDismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <div class="datepicker" id="datePicker">
    <select class="dateselect" id="yearSelect" aria-label="Year"></select>
    <select class="dateselect" id="monthSelect" aria-label="Month"></select>
    <select class="dateselect" id="daySelect" aria-label="Day"></select>
  </div>

  <div class="stage">
    <div class="navzone" id="prevZone" aria-label="Previous story" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="cardwrap" id="cardwrap">
      <div class="pull-indicator" id="pullIndicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
      </div>
    </div>
    <div class="navzone" id="nextZone" aria-label="Next story" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

  <div class="progressrow" id="progressRow"></div>
  <div class="hint">scroll a card to read in full · swipe or tap the edges for the next story</div>
</div>

<script>
/* ============================================================
   LEDGER — data layer
   Every new newspaper upload adds ONE new entry to NEWS_BY_DATE
   below, keyed "YYYY-MM-DD", containing that day's simplified
   finance stories in the same {tag, headline, body, stats,
   source} shape used here. Never edit or remove a past date's
   entry — just add the next one. The date-chip row at the top
   of the page is generated automatically from these keys, and
   selecting a date shows only that day's stories.
   ============================================================ */
const NEWS_BY_DATE = {
  "2026-06-09": {
    label: "09 Jun 2026",
    stories: [
  {
    tag: "Markets",
    headline: "War jitters in the Middle East just gave Indian markets their worst day in weeks",
    body: [
      "The Nifty 50 — the index that tracks India's 50 biggest listed companies and is the most-watched barometer of the stock market's health — fell 1.04% on Monday to close at 23,123 points. The trigger was news that Israel and Iran had traded missile fire for the first time since a U.S.-brokered ceasefire in April, reviving fears of a wider war in West Asia.",
      "The connection between a war thousands of kilometres away and Indian stock prices runs through oil. West Asia supplies a huge share of the world's crude, so any threat of conflict there tends to push oil prices up — and India imports about 85% of the oil it uses, so costlier crude usually means a costlier economy at home. On Monday, Brent crude (the global oil-price benchmark) rose to $94.38 a barrel, from about $93 on Friday.",
      "The damage on Dalal Street was broad: 20 of the Nifty's 21 sector indices fell, with only healthcare stocks bucking the trend. Adding to the pressure, foreign institutional investors (FIIs) — big overseas funds that buy and sell Indian shares — sold a net ₹51,000 crore worth of Indian stocks in just the first week of June. When foreign money leaves this fast, it also weakens the rupee, which slid to 95.61 against the U.S. dollar."
    ],
    stats: [
      {v:"23,123", down:true, l:"Nifty 50 close, down 1.04% on the day"},
      {v:"$94.38", up:true, l:"Brent crude oil price, per barrel"},
      {v:"₹51,000cr", l:"Foreign investors' net selling of Indian stocks, week of June 1"},
      {v:"₹95.61", down:true, l:"Rupee's exchange rate against the US dollar"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Energy",
    headline: "Delhi just made subsidised LPG cylinders scarcer for poor households — even as fuel firms lose money on every litre they sell",
    body: [
      "The Pradhan Mantri Ujjwala Yojana (PMUY) is the government's flagship scheme that gives free gas connections to poor households and then subsidises the cost of refilling their cooking-gas cylinders — about 10.55 crore households are covered. Until now, each household could get nine subsidised refills a year. The Petroleum Ministry has quietly cut that to just four, citing pressure on global LPG supplies from the war in West Asia.",
      "The subsidy math shows why the cut matters: a domestic cylinder costs ₹942 in Delhi, but a PMUY household pays only ₹642 thanks to a ₹300-per-cylinder government subsidy — a discount of about 60% versus what a cylinder would cost at full international pricing (which officials put closer to ₹1,600). A PMUY family typically uses four to five cylinders a year for cooking, so the cut to four refills could leave many of them short, especially in months when they need more.",
      "Meanwhile, the companies that actually sell the fuel are losing money on it. State-run oil marketing companies are absorbing an 'under-recovery' — the gap between what it costs them to supply the fuel and what they're allowed to charge at the pump — of about ₹30 on every litre of diesel and ₹6 on every litre of petrol sold, according to a senior Petroleum Ministry official. In effect, the government is choosing to shield consumers from the full spike in global fuel costs, while both its subsidy budget and its state oil companies absorb the strain."
    ],
    stats: [
      {v:"9 → 4", down:true, l:"Subsidised LPG refills per year under Ujjwala"},
      {v:"₹642", l:"Price a PMUY household pays per cylinder, vs. ₹942 market price"},
      {v:"₹30/litre", l:"Loss state oil firms take on every litre of diesel sold"},
      {v:"₹6/litre", l:"Loss state oil firms take on every litre of petrol sold"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Auto",
    headline: "India's showrooms just had their best May ever — despite a heatwave and rising fuel prices",
    body: [
      "Automakers usually report 'wholesale' numbers — how many vehicles they shipped to dealers — but the Federation of Automobile Dealers Associations (FADA) tracks something more telling: 'retail' sales, meaning vehicles that customers actually drove out of showrooms. By that measure, May 2026 was the best May on record, with 25.31 lakh (2.53 million) vehicles retailed across India — up 9.55% from a year earlier.",
      "Passenger vehicles (cars and SUVs) led the charge, up 23.25% to a record 4.02 lakh units for the month. Two-wheelers grew a more modest 7.54%, while tractors — often a proxy for how rural, farm-dependent India is feeling — rose 11.17%. Commercial vehicles and three-wheelers posted smaller single-digit gains.",
      "The one soft spot: compared with April, overall retail sales actually dipped 6.75%. Industry body FADA attributed this to the usual post-tax-season cooldown and a delayed monsoon, which tends to make rural buyers — a big chunk of two-wheeler and tractor demand — hold off on big purchases until the rains, and the income they bring, arrive."
    ],
    stats: [
      {v:"25.31 lakh", up:true, l:"Vehicles retailed in May, +9.55% year-on-year"},
      {v:"4.02 lakh", up:true, l:"Passenger vehicles sold — a new May record"},
      {v:"+23.25%", up:true, l:"Growth in passenger vehicle sales, year-on-year"},
      {v:"-6.75%", down:true, l:"Dip in sales compared with the previous month"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Solar",

      "The technical term for this pool of money is 'Expenses of Management,' or EoM — essentially, everything an insurer spends running the business, commissions included. Under the current 2023 rules, general insurers can spend up to 30% of gross premiums on EoM, and standalone health insurers up to 35%. Irdai's new proposal would force life insurers down to 15% within two years and 12.5% within five, while general insurers would need to reach 25% within two years and 20% within five.",
      "The numbers behind the push are stark: in FY26, private life insurers paid an average commission of 9% of total premiums collected, while private general insurers paid more than 20% — a gap Irdai clearly sees as unjustified. The proposal also bans banks and NBFCs from compulsorily bundling insurance with loans, a practice that has long been a source of customer complaints.",
      "If this goes through, the immediate losers are insurers and the banks/agents who distribute their products, who stand to earn meaningfully less per policy sold. The intended winner is the ordinary policyholder, who Irdai hopes will end up with cheaper premiums and more genuine choice, rather than being steered toward whichever product pays the seller the biggest commission."

      "Rare earths are a group of minerals essential to almost everything modern — electric-car motors, missiles, smartphones, wind turbines and robots. China doesn't just mine most of the world's rare earths; more importantly, it dominates the harder, more valuable steps that come after mining: refining these minerals and turning them into the finished high-performance magnets that machines actually use. JL Mag alone now has more than 10 times the production capacity of its closest American competitor.",
      "The scale gap is stark: the top US rare-earth magnet company, MP Materials, only started producing magnets last year, backed by a $400 million US government investment, and plans to eventually reach 10,000 tonnes of yearly capacity. JL Mag already produces several times that, and is still expanding — it plans to grow capacity by another 50% by next year alone.",
      "This matters hugely for future industries like humanoid robots, where China already accounts for 97% of global shipments — because robots need powerful magnets in their joints to work like muscles, and whoever controls magnet supply controls a critical ingredient of that industry. Even as the US and its allies pour billions into rival rare-earth supply chains, analysts say catching up to China's decades of manufacturing scale, cost efficiency and technical know-how will take far longer than most Western projects currently assume."
    ],
    stats: [
      {v:">10x", up:true, l:"JL Mag's capacity vs its closest US rival"},
      {v:"94%", l:"China's share of global rare-earth magnet manufacturing"},
      {v:"97%", up:true, l:"China's share of global humanoid robot shipments"},
      {v:"10,000 t/yr", l:"US rival MP Materials' planned eventual capacity"}
    ],
    source: "Mint · Long Story"
  }
    ]
  }
};

/* ============================================================
   UI layer — no need to touch this when refreshing NEWS_BY_DATE
   ============================================================ */
const wrap = document.getElementById('cardwrap');
const progressRow = document.getElementById('progressRow');
const yearSelect = document.getElementById('yearSelect');
const monthSelect = document.getElementById('monthSelect');
const daySelect = document.getElementById('daySelect');
const metaTop = document.getElementById('metaTop');
const prevZone = document.getElementById('prevZone');
const nextZone = document.getElementById('nextZone');

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const dateKeys = Object.keys(NEWS_BY_DATE).sort(); // chronological, oldest to newest
let currentDate = dateKeys[dateKeys.length - 1]; // default to the latest date with news
let stories = [];
let idx = 0;
let cardEls = [];

// Build a nested year -> month -> [days] index from the flat date keys,
// so the dropdowns only ever show dates that actually have news.
const dateIndex = {};
dateKeys.forEach(key => {
  const [y, m, d] = key.split('-');
  dateIndex[y] = dateIndex[y] || {};
  dateIndex[y][m] = dateIndex[y][m] || [];
  dateIndex[y][m].push(d);
});

function fmtVal(s){
  const cls = s.up ? 'v up' : (s.down ? 'v down' : 'v');
  const arrow = s.up ? '▲' : (s.down ? '▼' : '');
  return `<div class="${cls}">${arrow ? `<span>${arrow}</span>`:''}${s.v}</div>`;
}

function buildCard(item){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="cardscroll">
      <div class="cardinner">
        <span class="tag">${item.tag}</span>
        <h1>${item.headline}</h1>
        <div class="dek">
          ${item.body.map(p => `<p>${p}</p>`).join('')}
        </div>
        <div class="stats">
          ${item.stats.map(s => `
            <div class="stat">
              ${fmtVal(s)}
              <div class="l">${s.l}</div>
            </div>`).join('')}
        </div>
        <div class="source">${item.source} · Story ${item._n} of ${stories.length}</div>
      </div>
      <div class="scrollcue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  `;
  const scrollEl = el.querySelector('.cardscroll');
  const cueParent = scrollEl; // scrollHeight/scrollTop measured here
  scrollEl.addEventListener('scroll', () => {
    const atBottom = cueParent.scrollHeight - cueParent.scrollTop - cueParent.clientHeight < 24;
    const hasScrolled = cueParent.scrollTop > 18;
    scrollEl.classList.toggle('at-bottom', atBottom);
    scrollEl.classList.toggle('scrolled', hasScrolled);
  }, {passive:true});
  return el;
}

function fillSelect(selectEl, options){
  selectEl.innerHTML = options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
}

// Populate the year dropdown with every year that has at least one story.
function populateYears(selectedYear){
  const years = Object.keys(dateIndex).sort();
  fillSelect(yearSelect, years.map(y => ({value:y, label:y})));
  yearSelect.value = selectedYear;
}

// Populate the month dropdown with only the months that have news for the given year.
function populateMonths(year, selectedMonth){
  const months = Object.keys(dateIndex[year]).sort();
  fillSelect(monthSelect, months.map(m => ({value:m, label:MONTH_NAMES[parseInt(m,10)-1]})));
  monthSelect.value = selectedMonth;
}

// Populate the day dropdown with only the days that have news for the given year+month.
function populateDays(year, month, selectedDay){
  const days = dateIndex[year][month].slice().sort();
  fillSelect(daySelect, days.map(d => ({value:d, label:String(parseInt(d,10))})));
  daySelect.value = selectedDay;
}

function initDatePicker(){
  const [y, m, d] = currentDate.split('-');
  populateYears(y);
  populateMonths(y, m);
  populateDays(y, m, d);
}

function goToDate(key){
  if(key === currentDate) return;
  currentDate = key;
  idx = 0;
  renderAll();
}

yearSelect.addEventListener('change', () => {
  const y = yearSelect.value;
  const months = Object.keys(dateIndex[y]).sort();
  const m = months[0];
  populateMonths(y, m);
  const days = dateIndex[y][m].slice().sort();
  const d = days[0];
  populateDays(y, m, d);
  goToDate(`${y}-${m}-${d}`);
});

monthSelect.addEventListener('change', () => {
  const y = yearSelect.value;
  const m = monthSelect.value;
  const days = dateIndex[y][m].slice().sort();
  const d = days[0];
  populateDays(y, m, d);
  goToDate(`${y}-${m}-${d}`);
});

daySelect.addEventListener('change', () => {
  const y = yearSelect.value;
  const m = monthSelect.value;
  const d = daySelect.value;
  goToDate(`${y}-${m}-${d}`);
});

function renderAll(){
  stories = NEWS_BY_DATE[currentDate].stories;
  wrap.querySelectorAll('.card').forEach(c => c.remove());
  cardEls = stories.map((item, i) => {
    item._n = i + 1;
    const el = buildCard(item);
    el.classList.add(i === 0 ? 'active' : 'enter-right');
    el.style.zIndex = i === 0 ? 2 : 1;
    wrap.appendChild(el);
    return el;
  });
  buildDots();
  updateMeta();
}

function buildDots(){
  progressRow.innerHTML = '';
  stories.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < idx ? ' done' : '') + (i === idx ? ' now' : '');
    d.addEventListener('click', () => goTo(i));
    progressRow.appendChild(d);
  });
}

function updateMeta(){
  metaTop.textContent = `${idx+1} / ${stories.length} · ${NEWS_BY_DATE[currentDate].label}`;
  prevZone.classList.toggle('disabled', idx === 0);
  nextZone.classList.toggle('disabled', idx === stories.length - 1);
}

function goTo(newIdx){
  if(newIdx < 0 || newIdx >= stories.length || newIdx === idx) return;
  const dir = newIdx > idx ? 1 : -1;
  const current = cardEls[idx];
  const next = cardEls[newIdx];

  current.classList.remove('active');
  current.classList.add(dir > 0 ? 'leave-left' : 'leave-right');
  current.style.zIndex = 1;

  next.classList.remove('enter-right','enter-left','leave-left','leave-right');
  const nextScroll = next.querySelector('.cardscroll');
  if(nextScroll) nextScroll.scrollTop = 0;
  next.classList.add(dir > 0 ? 'enter-right' : 'enter-left');
  next.style.zIndex = 2;
  // force reflow so the transition triggers
  void next.offsetWidth;
  requestAnimationFrame(() => {
    next.classList.remove('enter-right','enter-left');
    next.classList.add('active');
  });

  idx = newIdx;
  buildDots();
  updateMeta();
}

prevZone.addEventListener('click', () => goTo(idx - 1));
nextZone.addEventListener('click', () => goTo(idx + 1));
prevZone.addEventListener('keydown', e => { if(e.key==='Enter') goTo(idx-1); });
nextZone.addEventListener('keydown', e => { if(e.key==='Enter') goTo(idx+1); });

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(idx + 1);
  if(e.key === 'ArrowLeft') goTo(idx - 1);
});

// touch / drag swipe on the card stack — only triggers on a mostly-horizontal
// gesture, so vertical scrolling to read a card is never hijacked
let startX = null, startY = null, dragging = false;
wrap.addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  dragging = true;
}, {passive:true});
wrap.addEventListener('touchend', (e) => {
  if(!dragging || startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  if(Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) goTo(idx + 1); else goTo(idx - 1);
  }
  dragging = false; startX = null; startY = null;
}, {passive:true});

let mouseStartX = null, mouseStartY = null, mouseDown = false;
wrap.addEventListener('mousedown', (e) => { mouseDown = true; mouseStartX = e.clientX; mouseStartY = e.clientY; });
window.addEventListener('mouseup', (e) => {
  if(!mouseDown || mouseStartX === null) return;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) goTo(idx + 1); else goTo(idx - 1);
  }
  mouseDown = false; mouseStartX = null; mouseStartY = null;
});

/* ============================================================
   Pull-to-refresh — dragging down (or scrolling up) while the
   active card is already at the top of its own scroll reloads
   the page to fetch the latest ledger. Stands in for a dedicated
   refresh button: the gesture only engages at scrollTop 0, so it
   never fights normal reading-scroll inside a card.
   ============================================================ */
const PULL_THRESHOLD = 64;  // px of resistance-adjusted pull to trigger a refresh
const PULL_MAX = 92;        // px cap so the card never drags too far
const pullIndicator = document.getElementById('pullIndicator');
const pullIcon = pullIndicator.querySelector('svg');
let pullDist = 0;
let refreshing = false;

function activeCardScroll(){
  const card = cardEls[idx];
  return card ? { card, scroll: card.querySelector('.cardscroll') } : null;
}

function setPull(dist, animate){
  const active = activeCardScroll();
  if(!active) return;
  pullDist = dist;
  const progress = Math.min(dist / PULL_THRESHOLD, 1);
  active.card.style.transition = animate ? 'transform .3s cubic-bezier(.22,.68,0,1)' : 'none';
  active.card.style.transform = dist > 0 ? `translateY(${dist}px)` : '';
  pullIndicator.style.opacity = progress;
  pullIcon.style.transform = `rotate(${progress * 180}deg)`;
}

function triggerRefresh(){
  if(refreshing) return;
  refreshing = true;
  setPull(46, true);
  pullIndicator.classList.add('refreshing');
  pullIcon.style.transform = '';
  setTimeout(() => window.location.reload(), 380);
}

// touch: pull down from the top of the current card's content
let pullStartY = null, pullActive = false;
wrap.addEventListener('touchstart', (e) => {
  if(refreshing) return;
  const active = activeCardScroll();
  if(!active || !active.scroll) return;
  pullStartY = e.touches[0].clientY;
  pullActive = active.scroll.scrollTop <= 0;
}, {passive:true});

wrap.addEventListener('touchmove', (e) => {
  if(refreshing || !pullActive || pullStartY === null) return;
  const active = activeCardScroll();
  if(!active || active.scroll.scrollTop > 0){
    if(pullDist > 0) setPull(0, true);
    pullActive = false;
    return;
  }
  const dy = e.touches[0].clientY - pullStartY;
  if(dy <= 0){
    if(pullDist > 0) setPull(0, true);
    return;
  }
  e.preventDefault();
  setPull(Math.min(dy * 0.5, PULL_MAX), false);
}, {passive:false});

wrap.addEventListener('touchend', () => {
  if(refreshing) return;
  if(pullDist >= PULL_THRESHOLD){
    triggerRefresh();
  } else if(pullDist > 0){    setPull(0, true);
  }
  pullActive = false;
  pullStartY = null;
}, {passive:true});

// wheel / trackpad: scrolling up while already at the top does the same thing
let wheelAccum = 0, wheelResetTimer = null;
wrap.addEventListener('wheel', (e) => {
  if(refreshing) return;
  const active = activeCardScroll();
  if(!active || !active.scroll || active.scroll.scrollTop > 0){
    if(pullDist > 0) setPull(0, true);
    wheelAccum = 0;
    return;
  }
  if(e.deltaY >= 0){
    wheelAccum = 0;
    if(pullDist > 0) setPull(0, true);
    return;
  }
  wheelAccum += -e.deltaY;
  const dist = Math.min(wheelAccum * 0.35, PULL_MAX);
  setPull(dist, false);
  clearTimeout(wheelResetTimer);
  if(dist >= PULL_THRESHOLD){
    triggerRefresh();
    return;
  }
  wheelResetTimer = setTimeout(() => { wheelAccum = 0; setPull(0, true); }, 260);
}, {passive:true});

initDatePicker();
renderAll();
// initialise scroll-cue visibility for the first card
requestAnimationFrame(() => {
  const firstScroll = cardEls[0] && cardEls[0].querySelector('.cardscroll');
  if(firstScroll) firstScroll.dispatchEvent(new Event('scroll'));
});

/* ============================================================
   Fullscreen toggle — hides browser chrome on mobile so only
   the Ledger UI is visible. Falls back gracefully (hides the
   button) on browsers/webviews that don't support the API.
   ============================================================ */
const fsBtn = document.getElementById('fsBtn');
const fsIcon = document.getElementById('fsIcon');
const EXPAND_ICON = `<polyline points="8 3 3 3 3 8"></polyline><polyline points="16 3 21 3 21 8"></polyline><polyline points="3 16 3 21 8 21"></polyline><polyline points="21 16 21 21 16 21"></polyline>`;
const COMPRESS_ICON = `<polyline points="3 8 8 8 8 3"></polyline><polyline points="21 8 16 8 16 3"></polyline><polyline points="8 21 8 16 3 16"></polyline><polyline points="16 21 16 16 21 16"></polyline>`;

function fsElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
}
function fsSupported(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
}
function updateFsButton(){
  const active = !!fsElement();
  fsIcon.innerHTML = active ? COMPRESS_ICON : EXPAND_ICON;
  fsBtn.setAttribute('aria-label', active ? 'Exit fullscreen' : 'Enter fullscreen');
  fsBtn.title = active ? 'Exit fullscreen' : 'Fullscreen';
}
function enterFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(!req) return;
  try{
    const r = req.call(el);
    if(r && r.catch) r.catch(() => {});
  }catch(err){ /* ignore — some webviews reject silently */ }
}
function exitFullscreen(){
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if(!exit) return;
  try{
    const r = exit.call(document);
    if(r && r.catch) r.catch(() => {});
  }catch(err){ /* ignore */ }
}
if(fsSupported()){
  fsBtn.addEventListener('click', () => {
    if(fsElement()) exitFullscreen(); else enterFullscreen();
  });
  document.addEventListener('fullscreenchange', updateFsButton);
  document.addEventListener('webkitfullscreenchange', updateFsButton);
  document.addEventListener('msfullscreenchange', updateFsButton);
  updateFsButton();
}else{
  // No Fullscreen API in this browser/webview — hide the control rather than show a dead button.
  fsBtn.style.display = 'none';
}
</script>
</body>
</html>
