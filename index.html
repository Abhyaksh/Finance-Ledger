<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Ledger</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxMjMzMzEiLz4KICA8cmVjdCB4PSIxMyIgeT0iMzMiIHdpZHRoPSIxMSIgaGVpZ2h0PSIxNiIgcng9IjMiIGZpbGw9IiNkOWE2MzYiLz4KICA8cmVjdCB4PSIyNi41IiB5PSIyMiIgd2lkdGg9IjExIiBoZWlnaHQ9IjI3IiByeD0iMyIgZmlsbD0iI2Q5YTYzNiIvPgogIDxyZWN0IHg9IjQwIiB5PSIxMSIgd2lkdGg9IjExIiBoZWlnaHQ9IjM4IiByeD0iMyIgZmlsbD0iI2Q5YTYzNiIvPgo8L3N2Zz4K">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#123331;
    --ink-2:#1c4744;
    --paper:#efe8d8;
    --paper-2:#e6ddc8;
    --paper-line:#d8cbaa;
    --text:#20241f;
    --text-dim:#5a6058;
    --ochre:#b8811f;
    --ochre-deep:#8f640f;
    --brick:#a3392a;
    --cream:#f8f5ec;
    --fallback-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    --fallback-serif: Georgia, "Times New Roman", serif;
    --fallback-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --cream-fixed:#f8f5ec; /* always-light text/dots for the always-dark ink header & date picker — must NOT shift in dark mode */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#16241f; --paper-2:#1c2c26; --paper-line:#2c3b33;
      --text:#eee7d6; --text-dim:#9fa89c; --cream:#1c2c26;
      --ink:#0d1a17; --ink-2:#12241f;
    }
  }
  :root[data-theme="dark"]{
    --paper:#16241f; --paper-2:#1c2c26; --paper-line:#2c3b33;
    --text:#eee7d6; --text-dim:#9fa89c; --cream:#1c2c26;
    --ink:#0d1a17; --ink-2:#12241f;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--ink);
    background-image: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    font-family: 'IBM Plex Sans', var(--fallback-sans);
    color:var(--text);
    overscroll-behavior:none;
  }
  body{
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}

  .app{
    height:100%;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:14px 8px 10px;
  }
  @media (min-width:480px){
    .app{ padding:18px 14px 12px; }
  }

  .topbar{
    width:100%;
    max-width:480px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:2px 4px 12px;
    color:var(--cream-fixed);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
    flex-shrink:1;
  }
  .brand{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-weight:800;
    font-style:italic;
    font-size:clamp(15px, 4.6vw, 20px);
    letter-spacing:0.2px;
    color:var(--cream-fixed);
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand .ledger{ color:var(--ochre); font-style:normal; }
  .brand-badge{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:9px;
    font-weight:600;
    letter-spacing:0.07em;
    color:var(--ink);
    background:var(--ochre);
    border-radius:100px;
    padding:2.5px 7px 1.5px;
    flex-shrink:0;
  }
  @media (max-width:360px){
    .brand-badge{ display:none; }
  }
  .topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .meta{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-size:12.5px;
    font-weight:800;
    letter-spacing:.025em;
    color:var(--cream-fixed);
    text-align:right;
    line-height:1.35;
    min-width:0;
    text-shadow:0 1px 0 rgba(0,0,0,.18);
  }
  .fsbtn{
    flex-shrink:0;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #3c4d45;
    border-radius:7px;
    background:var(--ink-2);
    color:var(--cream-fixed);
    cursor:pointer;
    padding:0;
    transition: border-color .15s, background .15s;
  }
  .fsbtn:hover, .fsbtn:focus{ border-color:var(--ochre); }
  .fsbtn svg{ width:14px; height:14px; }
  .fsbtn.spinning svg{ animation:spin .7s linear; }
  @keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  .update-banner{
    display:none;
    width:100%;
    max-width:480px;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:0 4px 10px;
    padding:9px 12px;
    border-radius:10px;
    background:linear-gradient(180deg, #2a3a2f 0%, #1c2c26 100%);
    border:1px solid var(--ochre);
    box-shadow:0 2px 10px rgba(0,0,0,.3);
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11.5px;
    color:var(--cream-fixed);
    animation: bannerIn .25s ease;
  }
  .update-banner.show{ display:flex; }
  @keyframes bannerIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .update-banner-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .update-banner button{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    border-radius:6px;
    padding:4px 8px;
    border:1px solid var(--ochre);
    background:var(--ochre);
    color:var(--ink);
  }
  .update-banner button#updateBannerDismiss{
    background:transparent;
    color:var(--cream-fixed);
    border-color:#3c4d45;
    padding:4px 7px;
  }

  .datepicker{
    width:100%;
    max-width:480px;
    display:flex;
    gap:7px;
    padding:0 4px 12px;
  }
  .dateselect{
    flex:1 1 0;
    min-width:0;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:14px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--cream-fixed);
    background:linear-gradient(180deg, #1f3d39 0%, var(--ink-2) 100%);
    border:1.5px solid #46584f;
    border-radius:9px;
    padding:9px 6px;
    text-align:center;
    text-align-last:center;
    cursor:pointer;
    -webkit-appearance:none;
    appearance:none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 1px 3px rgba(0,0,0,.3);
    transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .dateselect:hover{ border-color:var(--ochre); }
  .dateselect:focus{
    border-color:var(--ochre);
    outline:none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 3px rgba(217,166,54,.28);
  }
  .dateselect:active{ transform:scale(.97); }
  .dateselect option{ background:var(--ink-2); color:var(--cream-fixed); font-weight:600; }

  .stage{
    position:relative;
    width:100%;
    max-width:480px;
    flex:1;
    display:flex;
    align-items:stretch;
    min-height:0;
  }

  .navzone{
    flex:0 0 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  @media (min-width:480px){
    .navzone{ flex-basis:28px; }
    .navzone svg{ width:16px; height:16px; }
  }
  .navzone svg{ width:14px; height:14px; opacity:0.55; transition:opacity .15s; }
  .navzone:hover svg{ opacity:0.95; }
  .navzone.disabled{ pointer-events:none; opacity:0.15; }

  .cardwrap{
    flex:1;
    min-width:0;
    position:relative;
    overflow:hidden;
    border-radius:18px;
  }

  /* Sits behind the active card at the very top of the stack; revealed
     as the card is dragged down during a pull-to-refresh gesture. */
  .pull-indicator{
    position:absolute;
    top:0; left:0; right:0;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:0;
    pointer-events:none;
    opacity:0;
  }
  .pull-indicator svg{
    width:19px;
    height:19px;
    color:var(--ochre);
    opacity:0.9;
  }
  .pull-indicator.refreshing svg{
    animation:spin .7s linear infinite;
  }

  /* .card only ever handles the left-right slide animation — it never
     scrolls itself, so animating its transform never fights a scroll
     gesture. .cardscroll is the one and only element that scrolls, and
     it never has a transition/transform on it, so scrolling stays smooth. */
  .card{
    position:absolute;
    inset:0;
    border-radius:18px;
    overflow:hidden;
    will-change:transform, opacity;
    pointer-events:none;
    transition: transform .38s cubic-bezier(.22,.68,0,1), opacity .3s ease;
  }
  .card.active{ pointer-events:auto; }
  .card.enter-right{ transform:translateX(24px); opacity:0; }
  .card.enter-left{ transform:translateX(-24px); opacity:0; }
  .card.active{ transform:translateX(0); opacity:1; }
  .card.leave-left{ transform:translateX(-24px); opacity:0; }
  .card.leave-right{ transform:translateX(24px); opacity:0; }

  .cardscroll{
    height:100%;
    width:100%;
    overflow-y:auto;
    overflow-x:hidden;
    overscroll-behavior:contain;
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-radius:18px;
    position:relative;
  }

  .cardinner{
    padding:18px 16px 22px;
    display:flex;
    flex-direction:column;
    min-height:100%;
    min-width:0;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  @media (min-width:480px){
    .cardinner{ padding:22px 22px 26px; }
  }

  .tag{
    display:inline-block;
    align-self:flex-start;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:11px;
    letter-spacing:0.06em;
    font-weight:600;
    color:var(--ochre-deep);
    background:transparent;
    border:1px solid var(--ochre-deep);
    border-radius:100px;
    padding:4px 10px 3px;
    margin-bottom:14px;
    flex-shrink:0;
    max-width:100%;
    overflow-wrap:break-word;
  }

  h1{
    font-family:'Source Serif 4', var(--fallback-serif);
    font-weight:700;
    font-size:clamp(20px, 5.8vw, 26px);
    line-height:1.22;
    margin:0 0 14px;
    color:var(--text);
    flex-shrink:0;
    overflow-wrap:break-word;
  }

  .dek p{
    font-size:15.5px;
    line-height:1.66;
    color:var(--text);
    margin:0 0 14px;
    overflow-wrap:break-word;
  }
  .dek p:last-child{ margin-bottom:0; }
  .dek b{ font-weight:600; color:var(--text); }

  .stats{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:10px;
    margin-top:18px;
    flex-shrink:0;
  }
  .stat{
    background:var(--cream);
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:10px 12px;
    min-width:0;
  }
  .stat .v{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-weight:600;
    font-size:15.5px;
    color:var(--text);
    display:flex;
    align-items:baseline;
    gap:5px;
    flex-wrap:wrap;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .stat .v.up{ color:#2c6e49; }
  .stat .v.down{ color:var(--brick); }
  .stat .l{
    font-size:11px;
    color:var(--text-dim);
    margin-top:3px;
    line-height:1.3;
    overflow-wrap:break-word;
  }

  .source{
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:16px;
    padding-top:10px;
    border-top:1px dashed var(--paper-line);
    flex-shrink:0;
  }

  .scrollcue{
    position:sticky;
    bottom:0;
    left:0;
    right:0;
    height:28px;
    margin-top:-28px;
    background:linear-gradient(180deg, rgba(239,232,216,0) 0%, var(--paper) 78%);
    pointer-events:none;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:5px;
  }
  .scrollcue svg{ width:14px; height:14px; opacity:0.4; color:var(--text-dim); }
  .cardscroll.at-bottom .scrollcue{ display:none; }

  .progressrow{
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:center;
    gap:5px;
    padding:14px 4px 4px;
    flex-wrap:wrap;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:#3c4d45;
    cursor:pointer;
    transition: background .2s, transform .2s;
  }
  .dot.done{ background:var(--ochre); }
  .dot.now{ background:var(--cream-fixed); transform:scale(1.4); }

  .hint{
    text-align:center;
    font-family:'IBM Plex Mono', var(--fallback-mono);
    font-size:10.5px;
    color:#7d8a80;
    padding-top:10px;
    letter-spacing:0.02em;
  }

  :focus-visible{ outline:2px solid var(--ochre); outline-offset:2px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-row">
      <div class="brand">Finance<span class="ledger">Ledger.</span></div>
      <div class="brand-badge">DAILY</div>
    </div>
    <div class="topbar-right">
      <div class="meta" id="metaTop">— · —</div>
      <button class="fsbtn" id="fsBtn" type="button" aria-label="Enter fullscreen" title="Fullscreen">
        <svg id="fsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8 3 3 3 3 8"></polyline>
          <polyline points="16 3 21 3 21 8"></polyline>
          <polyline points="3 16 3 21 8 21"></polyline>
          <polyline points="21 16 21 21 16 21"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="update-banner" id="updateBanner">
    <span>✦ New stories are up — tap to refresh</span>
    <div class="update-banner-actions">
      <button id="updateBannerRefresh" type="button">Refresh</button>
      <button id="updateBannerDismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
  </div>

  <div class="datepicker" id="datePicker">
    <select class="dateselect" id="yearSelect" aria-label="Year"></select>
    <select class="dateselect" id="monthSelect" aria-label="Month"></select>
    <select class="dateselect" id="daySelect" aria-label="Day"></select>
  </div>

  <div class="stage">
    <div class="navzone" id="prevZone" aria-label="Previous story" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="cardwrap" id="cardwrap">
      <div class="pull-indicator" id="pullIndicator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
      </div>
    </div>
    <div class="navzone" id="nextZone" aria-label="Next story" role="button" tabindex="0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

  <div class="progressrow" id="progressRow"></div>
  <div class="hint">scroll a card to read in full · swipe or tap the edges for the next story</div>
</div>

<script>
/* ============================================================
   LEDGER — data layer
   Every new newspaper upload adds ONE new entry to NEWS_BY_DATE
   below, keyed "YYYY-MM-DD", containing that day's simplified
   finance stories in the same {tag, headline, body, stats,
   source} shape used here. Never edit or remove a past date's
   entry — just add the next one. The date-chip row at the top
   of the page is generated automatically from these keys, and
   selecting a date shows only that day's stories.
   ============================================================ */
const NEWS_BY_DATE = {
  "2026-06-09": {
    label: "09 Jun 2026",
    stories: [
  {
    tag: "Markets",
    headline: "War jitters in the Middle East just gave Indian markets their worst day in weeks",
    body: [
      "The Nifty 50 — the index that tracks India's 50 biggest listed companies and is the most-watched barometer of the stock market's health — fell 1.04% on Monday to close at 23,123 points. The trigger was news that Israel and Iran had traded missile fire for the first time since a U.S.-brokered ceasefire in April, reviving fears of a wider war in West Asia.",
      "The connection between a war thousands of kilometres away and Indian stock prices runs through oil. West Asia supplies a huge share of the world's crude, so any threat of conflict there tends to push oil prices up — and India imports about 85% of the oil it uses, so costlier crude usually means a costlier economy at home. On Monday, Brent crude (the global oil-price benchmark) rose to $94.38 a barrel, from about $93 on Friday.",
      "The damage on Dalal Street was broad: 20 of the Nifty's 21 sector indices fell, with only healthcare stocks bucking the trend. Adding to the pressure, foreign institutional investors (FIIs) — big overseas funds that buy and sell Indian shares — sold a net ₹51,000 crore worth of Indian stocks in just the first week of June. When foreign money leaves this fast, it also weakens the rupee, which slid to 95.61 against the U.S. dollar."
    ],
    stats: [
      {v:"23,123", down:true, l:"Nifty 50 close, down 1.04% on the day"},
      {v:"$94.38", up:true, l:"Brent crude oil price, per barrel"},
      {v:"₹51,000cr", l:"Foreign investors' net selling of Indian stocks, week of June 1"},
      {v:"₹95.61", down:true, l:"Rupee's exchange rate against the US dollar"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Energy",
    headline: "Delhi just made subsidised LPG cylinders scarcer for poor households — even as fuel firms lose money on every litre they sell",
    body: [
      "The Pradhan Mantri Ujjwala Yojana (PMUY) is the government's flagship scheme that gives free gas connections to poor households and then subsidises the cost of refilling their cooking-gas cylinders — about 10.55 crore households are covered. Until now, each household could get nine subsidised refills a year. The Petroleum Ministry has quietly cut that to just four, citing pressure on global LPG supplies from the war in West Asia.",
      "The subsidy math shows why the cut matters: a domestic cylinder costs ₹942 in Delhi, but a PMUY household pays only ₹642 thanks to a ₹300-per-cylinder government subsidy — a discount of about 60% versus what a cylinder would cost at full international pricing (which officials put closer to ₹1,600). A PMUY family typically uses four to five cylinders a year for cooking, so the cut to four refills could leave many of them short, especially in months when they need more.",
      "Meanwhile, the companies that actually sell the fuel are losing money on it. State-run oil marketing companies are absorbing an 'under-recovery' — the gap between what it costs them to supply the fuel and what they're allowed to charge at the pump — of about ₹30 on every litre of diesel and ₹6 on every litre of petrol sold, according to a senior Petroleum Ministry official. In effect, the government is choosing to shield consumers from the full spike in global fuel costs, while both its subsidy budget and its state oil companies absorb the strain."
    ],
    stats: [
      {v:"9 → 4", down:true, l:"Subsidised LPG refills per year under Ujjwala"},
      {v:"₹642", l:"Price a PMUY household pays per cylinder, vs. ₹942 market price"},
      {v:"₹30/litre", l:"Loss state oil firms take on every litre of diesel sold"},
      {v:"₹6/litre", l:"Loss state oil firms take on every litre of petrol sold"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Auto",
    headline: "India's showrooms just had their best May ever — despite a heatwave and rising fuel prices",
    body: [
      "Automakers usually report 'wholesale' numbers — how many vehicles they shipped to dealers — but the Federation of Automobile Dealers Associations (FADA) tracks something more telling: 'retail' sales, meaning vehicles that customers actually drove out of showrooms. By that measure, May 2026 was the best May on record, with 25.31 lakh (2.53 million) vehicles retailed across India — up 9.55% from a year earlier.",
      "Passenger vehicles (cars and SUVs) led the charge, up 23.25% to a record 4.02 lakh units for the month. Two-wheelers grew a more modest 7.54%, while tractors — often a proxy for how rural, farm-dependent India is feeling — rose 11.17%. Commercial vehicles and three-wheelers posted smaller single-digit gains.",
      "The one soft spot: compared with April, overall retail sales actually dipped 6.75%. Industry body FADA attributed this to the usual post-tax-season cooldown and a delayed monsoon, which tends to make rural buyers — a big chunk of two-wheeler and tractor demand — hold off on big purchases until the rains, and the income they bring, arrive."
    ],
    stats: [
      {v:"25.31 lakh", up:true, l:"Vehicles retailed in May, +9.55% year-on-year"},
      {v:"4.02 lakh", up:true, l:"Passenger vehicles sold — a new May record"},
      {v:"+23.25%", up:true, l:"Growth in passenger vehicle sales, year-on-year"},
      {v:"-6.75%", down:true, l:"Dip in sales compared with the previous month"}
    ],
    source: "The Hindu · Business"
  },
  {
    tag: "Solar",

      "Buy a life or general insurance policy in India today, and a meaningful chunk of your premium doesn't go toward your coverage — it goes to whoever sold it to you, as a commission. The insurance regulator, Irdai, thinks that chunk is too big, and on Wednesday proposed a sweeping rulebook to shrink it.",
      "The technical term for this pool of money is 'Expenses of Management,' or EoM — essentially, everything an insurer spends running the business, commissions included. Under the current 2023 rules, general insurers can spend up to 30% of gross premiums on EoM, and standalone health insurers up to 35%. Irdai's new proposal would force life insurers down to 15% within two years and 12.5% within five, while general insurers would need to reach 25% within two years and 20% within five.",

      "If this goes through, the immediate losers are insurers and the banks/agents who distribute their products, who stand to earn meaningfully less per policy sold. The intended winner is the ordinary policyholder, who Irdai hopes will end up with cheaper premiums and more genuine choice, rather than being steered toward whichever product pays the seller the biggest commission."

      "Here's the backstory: Nayara's Vadinar refinery is 49%-owned by Russia's state oil company Rosneft. When the EU sanctioned Nayara in July 2025 over that link, SAP India suspended Nayara's software support, citing an obligation to comply with EU sanctions law through its German parent company. Nayara took SAP to court, arguing that its contract with SAP India was an agreement between two Indian companies, governed by Indian law — not EU law.",
      "The court agreed, at least for now. It found SAP's defense — that continuing services could expose its German parent to criminal liability in Germany — not convincing on the facts presented, and noted that the order in question was against SAP's Indian entity specifically, which is bound by Indian contract law regardless of what its foreign parent is required to do elsewhere. SAP can still appeal to a larger bench of the court.",
      "This matters well beyond one refiner and one software vendor. Indian companies increasingly depend on foreign technology providers for critical infrastructure — cloud services, enterprise software, communication tools — and this case is an early signal of how Indian courts may handle the next dispute where a foreign government's sanctions collide with a purely domestic contract. It's not blanket immunity from sanctions, legal experts caution, but it does mean foreign sanctions can't simply be assumed to override Indian law without being tested in an Indian court first."
